<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Fondo -->
  <rect width="1200" height="630" fill="#F5F7FA"/>

  <!-- Flor de mburucuyá watermark grande -->
  <g opacity="0.06" transform="translate(600,315) scale(2.5) translate(-100,-100)">
    <g fill="#5B2A86">
      <ellipse cx="100" cy="50" rx="14" ry="30" transform="rotate(0 100 100)"/>
      <ellipse cx="100" cy="50" rx="14" ry="30" transform="rotate(60 100 100)"/>
      <ellipse cx="100" cy="50" rx="14" ry="30" transform="rotate(120 100 100)"/>
      <ellipse cx="100" cy="50" rx="14" ry="30" transform="rotate(180 100 100)"/>
      <ellipse cx="100" cy="50" rx="14" ry="30" transform="rotate(240 100 100)"/>
      <ellipse cx="100" cy="50" rx="14" ry="30" transform="rotate(300 100 100)"/>
    </g>
    <g fill="#4A7C59" opacity="0.7">
      <ellipse cx="100" cy="60" rx="9" ry="20" transform="rotate(30 100 100)"/>
      <ellipse cx="100" cy="60" rx="9" ry="20" transform="rotate(90 100 100)"/>
      <ellipse cx="100" cy="60" rx="9" ry="20" transform="rotate(150 100 100)"/>
      <ellipse cx="100" cy="60" rx="9" ry="20" transform="rotate(210 100 100)"/>
      <ellipse cx="100" cy="60" rx="9" ry="20" transform="rotate(270 100 100)"/>
      <ellipse cx="100" cy="60" rx="9" ry="20" transform="rotate(330 100 100)"/>
    </g>
    <circle cx="100" cy="100" r="12" fill="#4A7C59"/>
  </g>

  <!-- Logo Ñ pixelada (escalado 3x desde original) -->
  <g transform="translate(312,140) scale(3)">
    <!-- Tilde verde -->
    <rect x="14" y="20" width="8" height="8" rx="1.5" fill="#4A7C59"/>
    <rect x="25" y="18" width="8" height="8" rx="1.5" fill="#4A7C59"/>
    <rect x="36" y="20" width="8" height="8" rx="1.5" fill="#4A7C59"/>
    <!-- Cuerpo morado -->
    <rect x="12" y="36" width="10" height="10" rx="1.5" fill="#5B2A86"/>
    <rect x="12" y="49" width="10" height="10" rx="1.5" fill="#5B2A86"/>
    <rect x="12" y="62" width="10" height="10" rx="1.5" fill="#5B2A86"/>
    <rect x="12" y="75" width="10" height="10" rx="1.5" fill="#5B2A86"/>
    <rect x="25" y="36" width="10" height="10" rx="1.5" fill="#5B2A86"/>
    <rect x="38" y="49" width="10" height="10" rx="1.5" fill="#5B2A86"/>
    <rect x="51" y="62" width="10" height="10" rx="1.5" fill="#5B2A86"/>
    <rect x="51" y="36" width="10" height="10" rx="1.5" fill="#5B2A86"/>
    <rect x="51" y="49" width="10" height="10" rx="1.5" fill="#5B2A86"/>
    <rect x="51" y="75" width="10" height="10" rx="1.5" fill="#5B2A86"/>
    <rect x="51" y="62" width="10" height="10" rx="1.5" fill="#5B2A86"/>
  </g>

  <!-- Texto "ande ERP" -->
  <text x="522" y="300" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-size="72" font-weight="700" fill="#5B2A86">ande</text>
  <text x="714" y="300" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-size="72" font-weight="700" fill="#4A7C59">ERP</text>

  <!-- Eslogan -->
  <text x="600" y="465" text-anchor="middle" font-family="'Inter','Segoe UI',sans-serif" font-size="28" font-weight="400" fill="#5A6470">Hecho en Paraguay. Hecho para Paraguay.</text>

  <!-- Badges inferiores: las mismas capacidades que quedaron en la landing -->
  <g transform="translate(600,512)">
    <!-- Punto de Venta Rápido -->
    <rect x="-228" y="0" width="210" height="36" rx="18" fill="white" stroke="#5B2A86" stroke-width="1.5"/>
    <text x="-123" y="23" text-anchor="middle" font-family="'Inter',sans-serif" font-size="13" font-weight="600" fill="#5B2A86">Punto de Venta Rápido</text>
    <!-- Inventario Centralizado -->
    <rect x="2" y="0" width="225" height="36" rx="18" fill="white" stroke="#4A7C59" stroke-width="1.5"/>
    <text x="114" y="23" text-anchor="middle" font-family="'Inter',sans-serif" font-size="13" font-weight="600" fill="#4A7C59">Inventario Centralizado</text>
  </g>

  <!-- URL inferior -->
  <text x="600" y="588" text-anchor="middle" font-family="'Inter',sans-serif" font-size="18" font-weight="500" fill="#5B2A86">guaranisof.com</text>
</svg>
